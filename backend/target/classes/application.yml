spring:
  application:
    name: agrolink-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/agrolink}
      auto-index-creation: false
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: AgroLink API
    description: Agricultural marketplace platform
    version: 0.1.0-SNAPSHOT

agrolink:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
      - X-Correlation-Id
    allow-credentials: true
    max-age: 3600
  security:
    jwt:
      secret: ${JWT_SECRET:AgroLinkDevSecretKeyMustBeAtLeast256BitsLongForHS256!!}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
      issuer: ${JWT_ISSUER:agrolink-api}
      header: Authorization
      prefix: "Bearer "
  api:
    base-path: /api/v1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

logging:
  level:
    root: INFO
    com.agrolink: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} [corr=%X{correlationId}] [user=%X{userId}] - %msg%n"
